name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: go-tests-rust-workers
          cache-on-failure: true
      - name: Build Rust workers
        working-directory: rust
        run: cargo build --release --locked --bins
      - name: Test
        env:
          ND_GRPCWORKERINTESTS: "1"
          ND_METADATAWORKERPATH: ${{ github.workspace }}/rust/target/release/navidrome-metadata
          ND_SCANNERWORKERPATH: ${{ github.workspace }}/rust/target/release/navidrome-scanner
          ND_APIKEYSWORKERPATH: ${{ github.workspace }}/rust/target/release/navidrome-apikeys
          ND_SEARCHWORKERPATH: ${{ github.workspace }}/rust/target/release/navidrome-search
          ND_INTEGRATIONWORKERPATH: ${{ github.workspace }}/rust/target/release/navidrome-integration
        run: go test -shuffle=on -tags netgo,sqlite_fts5 -race ./...

  lint:
    name: Go lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout 5m
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code

  rust:
    name: Rust tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: metadata
            package: navidrome-metadata
          - crate: h3-gateway
            directory: rust/h3-gateway
          - crate: search
            package: navidrome-search
          - crate: scanner
            package: navidrome-scanner
          - crate: integration
            package: navidrome-integration
          - crate: apikeys
            package: navidrome-apikeys
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        working-directory: ${{ matrix.directory || 'rust' }}
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.directory || 'rust' }}
          shared-key: rust-tests-${{ matrix.crate }}
          cache-on-failure: true
      - name: Test workspace crate
        if: matrix.package
        working-directory: rust
        run: cargo test --locked -p ${{ matrix.package }}
      - name: Test standalone crate
        if: matrix.directory
        working-directory: ${{ matrix.directory }}
        run: cargo test --locked

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify Bun 1.4 runtime
        run: |
          case "$(bun --version)" in 1.4.*) ;; *) echo "Bun 1.4 required" >&2; exit 1 ;; esac
          bun -e 'const m = new Map([[2**32, "a"], [2**33, "b"]]); if (m.size !== 2) throw new Error("Bun 1.4 Map/Set large-integer regression detected")'
      - name: Install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Check
        working-directory: ui
        run: |
          bun run type-check
          bun run check:typescript-migration
          bun run check:mui9
          bun run lint
          bun run check-formatting
          bun run test
      - name: Build
        working-directory: ui
        run: bun run build

  i18n:
    name: i18n validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON and translations
        run: |
          for file in resources/i18n/*.json; do jq empty "$file"; done
          ./.github/workflows/validate-translations.sh -v
