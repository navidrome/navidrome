name: Build UI prototype image

on:
  push:
    branches:
      - prototype/modern-songs-ui
  workflow_dispatch:

concurrency:
  group: ui-prototype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build prototype linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push prototype image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ui-prototype
          labels: |
            org.opencontainers.image.title=Navidrome UI prototype
            org.opencontainers.image.description=Disposable UI concepts for evaluation only
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=ui-prototype
            VITE_UI_PROTOTYPE=true
          cache-from: type=gha,scope=ui-prototype-amd64
          cache-to: type=gha,mode=max,scope=ui-prototype-amd64
          provenance: mode=max
          sbom: true
