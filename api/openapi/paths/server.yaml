get:
  operationId: getServerInfo
  x-module: core
  x-stability-level: alpha
  tags: [server]
  security: []
  summary: Describe the server
  description: |
    Returns the public server description. No authentication required.
    Capability modules are listed by `GET /capabilities`.
  responses:
    '200':
      description: Server description.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServerInfo.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
