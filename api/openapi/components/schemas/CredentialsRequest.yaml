type: object
description: "Username, password and client description for a login or first-admin setup."
required: [username, password, client]
properties:
  username:
    type: string
    minLength: 1
    maxLength: 255
    description: Login name.
  password:
    type: string
    minLength: 1
    maxLength: 1024
    description: Password.
  client:
    type: string
    minLength: 1
    maxLength: 64
    description: Name of the client app.
  clientVersion:
    type: string
    maxLength: 32
    description: Version of the client app.
  name:
    type: string
    minLength: 1
    maxLength: 64
    description: "Label for this grant. Defaults to `client`."
  scopes:
    type: array
    maxItems: 32
    description: "Scopes the grant may hold. Omit for `all`."
    items:
      $ref: ./ScopeRequest.yaml
