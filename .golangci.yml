version: "2"
run:
  build-tags:
    - netgo
    - sqlite_fts5
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - depguard
    - dogsled
    - durationcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - rowserrcheck
    - unconvert
    - whitespace
  disable:
    - staticcheck
  settings:
    depguard:
      rules:
        api-subsonic:
          list-mode: lax
          files:
            - "**/server/subsonic/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/server/nativeapi
              desc: &api_isolation "API packages must not import each other. Move shared code to a neutral package (for example server/filter or core/publicurl)."
            - pkg: github.com/navidrome/navidrome/server/jellyfin
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/apiv1
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/public
              desc: *api_isolation
        api-nativeapi:
          list-mode: lax
          files:
            - "**/server/nativeapi/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/server/subsonic
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/jellyfin
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/apiv1
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/public
              desc: *api_isolation
        api-jellyfin:
          list-mode: lax
          files:
            - "**/server/jellyfin/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/server/subsonic
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/nativeapi
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/apiv1
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/public
              desc: *api_isolation
        api-apiv1:
          list-mode: lax
          files:
            - "**/server/apiv1/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/server/subsonic
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/nativeapi
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/jellyfin
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/public
              desc: *api_isolation
        api-public:
          list-mode: lax
          files:
            - "**/server/public/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/server/subsonic
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/nativeapi
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/jellyfin
              desc: *api_isolation
            - pkg: github.com/navidrome/navidrome/server/apiv1
              desc: *api_isolation
        persistence-layer:
          list-mode: lax
          files:
            - "**/persistence/**"
            - "!$test"
          deny:
            - pkg: github.com/navidrome/navidrome/core
              desc: &persistence_layer "persistence implements the model repositories. Do not depend on business logic or HTTP layers; move the logic to core."
            - pkg: github.com/navidrome/navidrome/server
              desc: *persistence_layer
            - pkg: github.com/navidrome/navidrome/scanner
              desc: *persistence_layer
            - pkg: github.com/navidrome/navidrome/plugins
              desc: *persistence_layer
            - pkg: github.com/navidrome/navidrome/adapters
              desc: *persistence_layer
            - pkg: github.com/navidrome/navidrome/cmd
              desc: *persistence_layer
    errcheck:
      exclude-functions:
        - (*github.com/zeebo/xxh3.Hasher).Write
    gocritic:
      disable-all: true
      enabled-checks:
        - deprecatedComment
    gosec:
      excludes:
        - G501
        - G401
        - G505
        - G115
    forbidigo:
      forbid:
        - pattern: 'tx\.Exec$'
          msg: "use tx.ExecContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.Query$'
          msg: "use tx.QueryContext(ctx, ...) in migrations to propagate context"
        - pattern: 'tx\.QueryRow$'
          msg: "use tx.QueryRowContext(ctx, ...) in migrations to propagate context"
        - pattern: '^context\.(Background|TODO)$'
          msg: "in tests use the spec's ctx (from GinkgoT().Context()), t.Context() or b.Context()"
        - pattern: '^panic$'
          msg: "return an error instead of panicking; use log.Fatal only for startup failures that must stop the server"
    nolintlint:
      require-specific: true
      allow-unused: false
    govet:
      enable:
        - nilness
  exclusions:
    rules:
      - linters:
          - gosec
        path: _test\.go
        text: "G703"
      - path: _test\.go
        linters:
          - containedctx
      # forbidigo rules are scoped by their msg: "in migrations", "in tests use" or "instead of panicking"
      - path-except: 'db/migrations/'
        linters:
          - forbidigo
        text: "in migrations"
      - path-except: '(_test\.go|^tests/)'
        linters:
          - forbidigo
        text: "in tests use"
      - path: '(_test\.go|^tests/|/storagetest/)'
        linters:
          - forbidigo
        text: "instead of panicking"
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
      - _gen\.go$
      - .worktrees
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules
