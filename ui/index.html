<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
            name="description"
            content="Navidrome Music Server - {{.Version}}"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5b5fd5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      manifest.webmanifest provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:site_name" content="Navidrome">
    <meta property="og:url" content="{{ .ShareURL }}">
    <meta property="og:title" content="{{ .ShareDescription }}">
    <meta property="og:image" content="{{ .ShareImageURL }}">
    <meta property="og:image:width" content="300">
    <meta property="og:image:height" content="300">
    <title>Navidrome</title>
    <script>
      // Shim for libraries that check for Node.js process object
      window.process = { env: {} };
    </script>
    <script>
      // Opt-in simple mode: paint buttons BEFORE React. Replacing RA Layout
      // caused a blank #303030 screen; this shell cannot be blanked by React.
      (function () {
        try {
          if (localStorage.getItem('nd.simpleMobile') === '1') {
            document.documentElement.setAttribute('data-simple-mobile', '1');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      window.__APP_CONFIG__ = {{ .AppConfig }}
    </script>
    <script>
      window.__SHARE_INFO__ = {{ .ShareInfo }}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="nd-static-simple" role="main" style="display:none;position:fixed;inset:0;z-index:2147483646;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;background:#121212;color:#fff;font-family:system-ui,-apple-system,sans-serif;">
      <h1 style="margin:0 0 8px;font-size:28px;font-weight:600;">Navidrome</h1>
      <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;">
        <button type="button" id="nd-static-shuffle" style="min-height:72px;width:100%;font-size:20px;font-weight:600;border:none;border-radius:8px;background:#90caf9;color:#000;">Play random songs</button>
        <button type="button" id="nd-static-full" style="min-height:56px;width:100%;font-size:16px;border-radius:8px;border:1px solid #666;background:transparent;color:#fff;">Open full version</button>
      </div>
    </div>
    <script>
      (function () {
        var shell = document.getElementById('nd-static-simple');
        if (!shell) return;
        var on = false;
        try { on = localStorage.getItem('nd.simpleMobile') === '1'; } catch (e) {}
        if (!on) return;
        shell.style.display = 'flex';
        document.body.style.backgroundColor = '#121212';
        var full = document.getElementById('nd-static-full');
        var shuffle = document.getElementById('nd-static-shuffle');
        if (full) {
          full.onclick = function () {
            try { localStorage.setItem('nd.simpleMobile', '0'); } catch (e) {}
            location.reload();
          };
        }
        if (shuffle) {
          shuffle.onclick = function () {
            shuffle.disabled = true;
            shuffle.textContent = '…';
            var tries = 0;
            var t = setInterval(function () {
              tries += 1;
              if (typeof window.__ndPlayRandom === 'function') {
                clearInterval(t);
                try { window.__ndPlayRandom(); } catch (e) {}
                shuffle.disabled = false;
                shuffle.textContent = 'Play random songs';
                return;
              }
              if (tries > 40) {
                clearInterval(t);
                shuffle.disabled = false;
                shuffle.textContent = 'Play random songs';
              }
            }, 250);
          };
        }
      })();
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
  <script type="module" src="/src/index.jsx"></script>
</html>
