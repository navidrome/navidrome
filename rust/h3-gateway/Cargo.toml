[package]
name = "navidrome-h3"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "Tokio + tokio-quiche HTTP/3 transport companion for Navidrome"

[workspace]

[[bin]]
name = "navidrome-h3"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-compression = { version = "0.4.43", features = ["brotli", "gzip", "tokio", "zstd"] }
bytes = "1.12.1"
env_logger = "0.11.11"
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = { version = "0.4.33", features = ["release_max_level_info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-quiche = { version = "=0.19.1", default-features = false }
tokio-util = { version = "0.7.19", features = ["io"] }

# Final JBS artifact: fat LTO (matches rust workspace release-fat policy).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
