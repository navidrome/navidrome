[package]
name = "navidrome-metadata"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "navidrome_metadata"
path = "src/lib.rs"

[[bin]]
name = "navidrome-metadata"
path = "src/main.rs"

[dependencies]
fts-normalize = { path = "../fts-normalize" }
anyhow = "1.0.104"
fast_image_resize = "=6.1.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "=0.25.1"
navidrome-grpc-listen = { path = "../grpc-listen" }
prost = "0.14.4"
quick-xml = { version = "0.42.0", default-features = false, features = ["escape-html"] }
regex = "1.13.1"
deunicode = "1.6.2"
uuid = "1.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
md-5 = "0.11.0"
rayon = "1.12.0"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
webp = { version = "=0.3.1", default-features = false }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
