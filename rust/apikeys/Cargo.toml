[package]
name = "navidrome-apikeys"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "navidrome_apikeys"
path = "src/lib.rs"

[[bin]]
name = "navidrome-apikeys"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
hex = "0.4.3"
navidrome-grpc-listen = { path = "../grpc-listen" }
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
