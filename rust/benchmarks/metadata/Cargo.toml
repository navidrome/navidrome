[package]
name = "navidrome-metadata-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
navidrome-metadata = { path = "../../metadata" }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "metadata_hotpaths"
harness = false

# Match workspace release-pgo-gen: fast instrumented criterion runs (no LTO).
[profile.release]
lto = "off"
codegen-units = 16

[profile.release-pgo-gen]
inherits = "release"
lto = "off"
codegen-units = 16
strip = "none"
