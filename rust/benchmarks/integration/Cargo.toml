[package]
name = "navidrome-integration-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
navidrome-integration = { path = "../../integration" }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bench]]
name = "integration_hotpaths"
harness = false

# Match workspace release-pgo-gen: fast instrumented criterion runs (no LTO).
[profile.release]
lto = "off"
codegen-units = 16

[profile.release-pgo-gen]
inherits = "release"
lto = "off"
codegen-units = 16
strip = "none"
