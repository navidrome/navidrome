[package]
name = "navidrome-integration"
version = "0.1.0"
edition = "2024"
publish = false
description = "Async gRPC outbound integration worker for Navidrome"

[lib]
name = "navidrome_integration"
path = "src/lib.rs"

[[bin]]
name = "navidrome-integration"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
navidrome-grpc-listen = { path = "../grpc-listen" }
md-5 = "0.11.0"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
